name: Keep Backend Alive

on:
  schedule:
    # Run every 14 minutes to prevent Render's 15-minute spin-down on free tier
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: curl -s https://tn-safety-app.onrender.com/health
